name: watch-deploy

# 속보 감시 서버(오라클 클라우드 무료 등급)에 설치하고, 저장소 시크릿의 키를 넣고, 다시 띄운다.
# 서버는 10분마다 스스로 새 코드를 받으므로(deploy/watch/update.sh) 평소엔 돌릴 일이 없다.
# 처음 설치할 때, 키를 바꿨을 때, 서버를 새로 만들었을 때만 수동으로 돌린다.
#
# 필요한 저장소 시크릿
#   WATCH_HOST     서버 공인 IP
#   WATCH_SSH_KEY  서버 접속 개인 키 (서버에는 짝이 되는 공개 키를 넣어 만든다)
#   ANTHROPIC_API_KEY · TELEGRAM_BOT_TOKEN · TELEGRAM_CHAT_ID — 브리핑과 같은 것
#   WATCH_TELEGRAM_CHAT_ID (선택) — 속보만 다른 사람에게 보내려면
on:
  workflow_dispatch:

concurrency:
  group: watch-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WATCH_HOST: ${{ secrets.WATCH_HOST }}
      WATCH_USER: ubuntu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 접속 준비
        env:
          WATCH_SSH_KEY: ${{ secrets.WATCH_SSH_KEY }}
        run: |
          test -n "$WATCH_HOST" || { echo "::error::WATCH_HOST 시크릿이 없습니다"; exit 1; }
          test -n "$WATCH_SSH_KEY" || { echo "::error::WATCH_SSH_KEY 시크릿이 없습니다"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$WATCH_SSH_KEY" > ~/.ssh/watch
          chmod 600 ~/.ssh/watch
          ssh-keyscan -T 20 "$WATCH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host watch\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/watch\n  ServerAliveInterval 30\n' \
            "$WATCH_HOST" "$WATCH_USER" > ~/.ssh/config

      - name: 설치·업데이트
        run: ssh watch 'sudo bash -s' < deploy/watch/setup.sh

      - name: 키 넣고 다시 띄우기
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCH_TELEGRAM_CHAT_ID: ${{ secrets.WATCH_TELEGRAM_CHAT_ID }}
        run: |
          one_line() { printf '%s' "$1" | tr '\r\n' ',,' | sed 's/,,*/,/g; s/^,//; s/,$//'; }
          {
            echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY"
            echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
            echo "TELEGRAM_CHAT_ID=$(one_line "$TELEGRAM_CHAT_ID")"
            echo "WATCH_TELEGRAM_CHAT_ID=$(one_line "$WATCH_TELEGRAM_CHAT_ID")"
          } | ssh watch 'sudo tee /etc/stock-pulse-watch.env >/dev/null &&
                         sudo chown root:stockpulse /etc/stock-pulse-watch.env &&
                         sudo chmod 640 /etc/stock-pulse-watch.env &&
                         sudo systemctl restart stock-pulse-watch'

      - name: 점검
        run: |
          ssh watch 'cd /opt/stock-pulse && sudo -u stockpulse bash -c "set -a; . /etc/stock-pulse-watch.env; set +a;
                     STOCK_PULSE_CACHE_DIR=/var/lib/stock-pulse/cache .venv/bin/python -m pipeline.run watch --once"'
          sleep 20
          ssh watch 'systemctl is-active stock-pulse-watch && sudo journalctl -u stock-pulse-watch -n 25 --no-pager'
