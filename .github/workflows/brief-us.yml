name: brief-us

# 미장 장전 브리핑 — 개장(09:30 ET) 20~75분 전 도착 목표.
# 설계 근거는 brief-kr.yml 머리말 참고 (스케줄러 지연 6~202분 대응).
#
# 미장만의 사정: cron 은 UTC 고정이라 서머타임을 못 따라간다. 그래서 슬롯을
# EDT/EST 양쪽 창을 모두 덮도록 UTC 08:40~14:00 에 40분 간격으로 깔고,
# 계절이 어긋난 슬롯은 gate 가 ET 실제 시각을 보고 걸러낸다.
#   EDT(UTC−4) 발송 창 = 12:15~13:10 UTC
#   EST(UTC−5) 발송 창 = 13:15~14:10 UTC
on:
  schedule:
    - cron: "40 8 * * 1-5"    # 04:40 EDT — 4시간 밀린 실행을 받는 슬롯
    - cron: "20 9 * * 1-5"
    - cron: "0 10 * * 1-5"
    - cron: "40 10 * * 1-5"
    - cron: "20 11 * * 1-5"
    - cron: "0 12 * * 1-5"
    - cron: "40 12 * * 1-5"   # 08:40 EDT — EDT 에서 지연이 없을 때의 슬롯
    - cron: "20 13 * * 1-5"   # 08:20 EST — EST 에서 지연이 없을 때의 슬롯
    - cron: "0 14 * * 1-5"    # 09:00 EST
  workflow_dispatch:

concurrency:
  group: stock-pulse-brief-US   # 슬롯끼리만 직렬화. data-sync/pulse 와는 무관하다
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      # 스케줄 트리거는 "예약 시점"의 SHA 를 준다. 중복 판정도 커밋도 최신
      # main 기준이어야 하므로 명시적으로 main 을 받는다.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Gate — 지금 발송해야 하는지
        id: gate
        run: |
          set -euo pipefail
          args="--market US"
          # 사람이 직접 돌린 실행은 시각·중복 검사를 건너뛴다.
          [ "${{ github.event_name }}" = "schedule" ] || args="$args --force"
          decision=$(python3 -m pipeline.run gate $args)
          echo "run=$decision" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == 'true'

      - name: 경량 갱신 (매크로·환율·뉴스)
        if: steps.gate.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m pipeline.run pulse --market US

      - name: 브리핑 생성 + 텔레그램 발송
        if: steps.gate.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python -m pipeline.run brief --market US --send

      # 발송이 실패하면 여기까지 오지 않는다 → 브리핑 파일이 커밋되지 않고,
      # 남은 슬롯이 같은 세션을 다시 시도한다.
      - name: 브리핑 + 갱신된 데이터 커밋
        if: steps.gate.outputs.run == 'true'
        run: |
          bash .github/scripts/commit-data.sh "chore(brief): US $(TZ=America/New_York date +'%Y-%m-%d')"
