name: brief-us

# 미장 장전 브리핑 — 개장 30분 전 도착 목표.
#
# 타이밍 계산
#   개장 09:30 ET → 목표 도착 09:00 ET (= 서머타임 22:00 KST / 표준시 23:00 KST)
#   --rebuild 포함 실행 시간 약 19분 → 08:41 ET 시작
#
# cron은 UTC 고정이라 서머타임을 따라가지 못하므로 두 슬롯을 모두 예약하고,
# ET 기준 08시가 아닌 쪽은 gate 스텝에서 즉시 종료한다.
#   12:41 UTC = 08:41 EDT (3~11월)  /  09:41 EST → 스킵
#   13:41 UTC = 08:41 EST (11~3월)  /  09:41 EDT → 스킵
#
# 분(minute)을 41로 둔 이유: GitHub 스케줄 큐는 정각·30분에 몰려 최대 1시간까지
# 밀린다(2026-07-26 brief-kr 실측 57분 지연). 한산한 분에 예약해 지연을 줄인다.
on:
  schedule:
    - cron: "41 12 * * 1-5"
    - cron: "41 13 * * 1-5"
  workflow_dispatch:

concurrency:
  group: stock-pulse-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      # 체크아웃보다 먼저 판정해 반대편 슬롯은 몇 초 만에 끝낸다.
      - name: Gate — ET 08시 슬롯만 진행
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ=America/New_York date +%H)
          if [ "$hour" = "08" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "ET ${hour}시 — 서머타임 반대편 슬롯이므로 건너뜁니다"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == 'true'

      - name: Build + send US brief
        if: steps.gate.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python -m pipeline.run brief --market US --send --rebuild

      - name: Commit brief + refreshed data
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "stock-pulse-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(brief): US $(date -u +'%Y-%m-%d')"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break || sleep 5
            done
          fi
