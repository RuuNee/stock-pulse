name: brief-kr

# 국장 장전 브리핑 — 개장(09:00 KST) 20~75분 전 도착 목표.
#
# ── 왜 이렇게 생겼나 ────────────────────────────────────────────────
# GitHub 의 schedule 은 "이 시각 이후 언젠가"라는 뜻이다. 이 저장소 실측 지연:
#   pulse      00:00Z 예약 → 01:54Z 시작 (+114분)
#   data-sync  07:30Z 예약 → 10:52Z 시작 (+202분)
#   brief-kr   23:11Z 예약 → 00:09Z 시작  (+58분)
#   brief-kr   23:23Z 예약 → 00:14Z 시작  (+51분)
# 마지막 두 줄이 2026-07-28 국장 브리핑 미발송의 직접 원인이다. 슬롯이 둘 다
# 09시가 넘어 깨어났고, gate 가 (옳게) 발송을 막았는데 대체 슬롯이 없었다.
#
# ── 고친 방식 ──────────────────────────────────────────────────────
# 1) 40분 간격 슬롯 7개(목표 −4h ~ 목표)를 예약한다. 발송 창이 55분이라
#    지연이 0~240분 어디에 걸리든 최소 하나는 창 안에 떨어진다.
#    (tests/test_schedule.py 가 이 커버리지를 실제로 검증한다)
# 2) gate 가 KST 실제 시각·휴장일·중복 발송을 보고 아니면 즉시 끝낸다.
#    창 밖 슬롯은 15초짜리라 남는 슬롯 값은 사실상 공짜다.
# 3) 발송 경로에서 전체 재빌드(--rebuild, 11~19분)를 뺐다. data-sync 가
#    종목·이벤트를 이미 만들어 두므로 브리핑에 새로 필요한 건 매크로와 뉴스뿐
#    이고, 그건 pulse 가 1분이면 갱신한다. 슬롯을 3.5배로 늘렸는데도 하루
#    사용 분은 오히려 줄었다.
# 4) concurrency 그룹을 data-sync/pulse 와 분리했다. 예전에는 26분짜리
#    data-sync 뒤에 큐잉되면서 발송 창을 통째로 놓칠 수 있었다.
#
# ── 2026-08-07: 슬롯을 깔아도 안 되는 경우가 있다 ──────────────────
# 그날 국장 브리핑이 또 통째로 안 나갔다. 원인은 슬롯 부족이 아니라 방출 방식
# 이었다 — GitHub 이 슬롯 7개를 하나씩 밀어서 깨우지 않고 **한 덩어리로 모아**
# 09:44~10:45 KST 에 쏟았다. 240분에 걸쳐 퍼져 있어야 할 배치가 61분으로
# 접히면서 7개가 전부 창 뒤에 떨어졌고, gate 는 설계대로 전부 버렸다.
# 슬롯을 더 까는 것으로는 이 형태를 못 막는다. 그래서 두 갈래로 받친다:
# 5) 지각 발송 — 창을 놓쳐도 지각 마감(config.BRIEF_LATE_CUTOFF, KR 12:00)
#    전이면 '늦은 브리핑'으로 표시해서 보낸다. 안 오는 것보다 낫다.
# 6) 외부 트리거 — cron-job.org 가 정시에 workflow_dispatch 를 부른다.
#    dispatch 는 큐 지연이 없다. 이때는 `force=false` 로 불러서 휴장일·중복·
#    발송 창 검사를 그대로 태운다. 절차는 05-운영가이드 ⑦ 참고.
on:
  schedule:
    - cron: "20 19 * * 0-4"   # 04:20 KST — 4시간 밀린 실행을 받는 슬롯
    - cron: "0 20 * * 0-4"    # 05:00 KST
    - cron: "40 20 * * 0-4"   # 05:40 KST
    - cron: "20 21 * * 0-4"   # 06:20 KST
    - cron: "0 22 * * 0-4"    # 07:00 KST
    - cron: "40 22 * * 0-4"   # 07:40 KST
    - cron: "20 23 * * 0-4"   # 08:20 KST — 지연이 없을 때 발송하는 슬롯
  workflow_dispatch:
    inputs:
      send:
        description: "텔레그램으로 실제 발송 (끄면 리허설 — 빌드·렌더링만 확인하고 발송도 커밋도 안 함)"
        type: boolean
        default: true
      force:
        description: "게이트 무시하고 즉시 발송 (외부 스케줄러는 false 로 불러서 휴장일·중복·시각 검사를 그대로 태운다)"
        type: boolean
        default: true

concurrency:
  group: stock-pulse-brief-KR   # 슬롯끼리만 직렬화. data-sync/pulse 와는 무관하다
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      # 스케줄 트리거는 "예약 시점"의 SHA 를 준다. 중복 판정도 커밋도 최신
      # main 기준이어야 하므로 명시적으로 main 을 받는다.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Gate — 지금 발송해야 하는지
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SEND_INPUT: ${{ inputs.send }}    # 스케줄 실행에서는 빈 문자열
          FORCE_INPUT: ${{ inputs.force }}  # 〃
        run: |
          set -euo pipefail
          args="--market KR"
          send="--send"
          if [ "$EVENT" != "schedule" ]; then
            # 사람이 직접 돌린 실행은 시각·중복 검사를 건너뛴다. 외부 스케줄러
            # (cron-job.org 등)가 부를 때는 force=false 로 보내서 휴장일·중복·
            # 발송 창 검사를 그대로 태운다 — 안 그러면 휴장일에도 발송된다.
            if [ "${FORCE_INPUT:-true}" != "false" ]; then
              args="$args --force"
            fi
            if [ "${SEND_INPUT:-true}" = "false" ]; then
              send=""   # 리허설 — 발송도 커밋도 하지 않는다
              echo "리허설 모드: 빌드·렌더링만 확인합니다"
            fi
          fi
          # gate stdout: 1행 true/false, 2행 발송 모드(ontime|late|skip).
          gate=$(python3 -m pipeline.run gate $args)
          late=""
          if [ "$(printf '%s\n' "$gate" | sed -n 2p)" = "late" ]; then
            late="--late"   # 창을 놓친 발송 — 메시지에 '늦은 브리핑'을 박는다
          fi
          {
            echo "run=$(printf '%s\n' "$gate" | sed -n 1p)"
            echo "send=$send"
            echo "late=$late"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == 'true'

      - name: 경량 갱신 (매크로·환율·뉴스)
        if: steps.gate.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m pipeline.run pulse --market KR

      - name: 브리핑 생성 + 텔레그램 발송
        if: steps.gate.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python -m pipeline.run brief --market KR ${{ steps.gate.outputs.send }} ${{ steps.gate.outputs.late }}

      # 발송이 실패하면 여기까지 오지 않는다 → 브리핑 파일이 커밋되지 않고,
      # 남은 슬롯이 같은 세션을 다시 시도한다.
      # 리허설에서도 커밋하지 않는다 — 커밋하면 중복 게이트가 그날 진짜 발송을 막는다.
      - name: 브리핑 + 갱신된 데이터 커밋
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.send != ''
        run: |
          bash .github/scripts/commit-data.sh "chore(brief): KR $(TZ=Asia/Seoul date +'%Y-%m-%d')"
