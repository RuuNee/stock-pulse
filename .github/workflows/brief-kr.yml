name: brief-kr

# 국장 장전 브리핑 — 개장(09:00 KST) 30분 전 도착 목표.
#
# GitHub 스케줄러는 예약 시각을 지키지 않는다 (이 저장소 실측):
#   2026-07-26 brief-kr  22:30 UTC 예약 → 23:27Z 생성  (+57분)
#   2026-07-27 brief-us  12:30 UTC 예약 → 15:23Z 생성  (+173분)
# 그래서 단일 cron으로는 도착 시각을 맞출 수 없다. 대신:
#
#   1) 슬롯을 여러 개 예약한다. 하나가 밀려도 다음 슬롯이 제시간에 뜰 확률이 남는다.
#   2) gate 스텝이 KST 실제 시각을 보고 발송 창(08:05~08:35 KST) 밖이면 즉시 종료한다.
#      → 늦게 뜬 실행이 개장 후에 브리핑을 쏘는 일이 없다.
#   3) 오늘자 브리핑 파일이 이미 커밋돼 있으면 종료한다. → 중복 발송 방지.
#      (같은 concurrency 그룹이라 슬롯끼리 병렬로 겹치지 않는다)
#
# 슬롯 = 목표 도착시각 − 빌드 시간(--rebuild 포함 11~19분 실측).
#   08:11 KST 시작 → 08:22~08:30 도착 (개장 30~38분 전)
#   08:23 KST 시작 → 08:34~08:42 도착 (개장 18~26분 전, 1차가 밀렸을 때의 예비)
# 23:11/23:23 UTC 일~목 = 08:11/08:23 KST 월~금. KST는 서머타임이 없다.
on:
  schedule:
    - cron: "11 23 * * 0-4"
    - cron: "23 23 * * 0-4"
  workflow_dispatch:

concurrency:
  group: stock-pulse-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      # 체크아웃보다 먼저 판정해, 창 밖 실행은 몇 초 만에 끝낸다.
      - name: Gate — 발송 창(08:05~08:35 KST) 안인지
        id: window
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "수동 실행 — 시각 검사 생략"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now=$((10#$(TZ=Asia/Seoul date +%H%M)))
          echo "현재 KST $(TZ=Asia/Seoul date +%H:%M)"
          if [ "$now" -ge 805 ] && [ "$now" -le 835 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "발송 창 밖 — 건너뜁니다 (스케줄러 지연)"
          fi

      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'

      - name: Gate — 오늘자 브리핑이 이미 나갔는지
        id: dup
        if: steps.window.outputs.run == 'true'
        run: |
          session=$(python3 -c "from pipeline.util.dates import next_session_date; print(next_session_date('KR'))")
          # 세션 일자를 못 구하면 중복 판정이 무의미하다. 조용히 발송하느니 실패시킨다.
          if [ -z "$session" ]; then
            echo "세션 일자 계산 실패 — 중단"
            exit 1
          fi
          echo "대상 세션 $session"
          if [ -f "data/brief/${session}-KR.json" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "이미 발송됨 — 건너뜁니다"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.dup.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.dup.outputs.run == 'true'

      - name: Build + send KR brief
        if: steps.dup.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python -m pipeline.run brief --market KR --send --rebuild

      - name: Commit brief + refreshed data
        if: steps.dup.outputs.run == 'true'
        run: |
          git config user.name "stock-pulse-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(brief): KR $(date -u +'%Y-%m-%d')"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break || sleep 5
            done
          fi
