name: brief-kr

# 국장 장전 브리핑 — 개장 30분 전 도착 목표.
#
# 타이밍 계산
#   개장 09:00 KST → 목표 도착 08:30 KST
#   --rebuild 포함 실행 시간 약 19분 → 08:11 KST 시작 = 23:11 UTC (전날)
#   23:11 UTC 일~목 = 08:11 KST 월~금
#
# 분(minute)을 11로 둔 이유: GitHub 스케줄 큐는 정각·30분에 몰려 최대 1시간까지
# 밀린다(2026-07-26 이 워크플로 실측 57분 지연). 한산한 분에 예약해 지연을 줄인다.
on:
  schedule:
    - cron: "11 23 * * 0-4"
  workflow_dispatch:

concurrency:
  group: stock-pulse-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Build + send KR brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python -m pipeline.run brief --market KR --send --rebuild

      - name: Commit brief + refreshed data
        run: |
          git config user.name "stock-pulse-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(brief): KR $(date -u +'%Y-%m-%d')"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break || sleep 5
            done
          fi
