name: test

# 파이프라인·워크플로 스케줄을 건드린 푸시에서만 돈다. data/ 커밋은 하루에도
# 수십 번 올라오므로 paths 로 걸러 Actions 사용 분을 아낀다.
on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/brief-*.yml"
      - ".github/workflows/test.yml"
      - ".github/scripts/**"
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # brief-*.yml 의 게이트는 `pip install` 전에, 러너 기본 python3 로 돈다.
      # gate/config/dates 에 서드파티 import 가 섞이면 브리핑 워크플로가 첫
      # 스텝에서 죽고 그날 발송이 통째로 빠진다. 그래서 여기서 그 경로를 그대로
      # 재현한다 — setup-python 보다 먼저, 의존성 설치 없이.
      - name: 게이트는 표준 라이브러리만으로 돌아야 한다
        run: |
          /usr/bin/python3 -m pipeline.run gate --market KR
          /usr/bin/python3 -m pipeline.run gate --market US

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # tests/test_manifest.py 가 build.site_data 를 임포트하고, 그 체인이 pandas 를
      # 끌어온다. 수집 함수는 전부 스텁이라 네트워크는 타지 않지만 임포트는 실물이다.
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: bash -n .github/scripts/commit-data.sh
      - run: python -m pytest tests -q
