name: data-sync

# Rebuild all site data after each market close and commit the JSON.
# 07:30 UTC ≈ 16:30 KST (국장 마감 후), 21:30 UTC ≈ 06:30 KST (미장 마감 후).
on:
  schedule:
    - cron: "30 7,21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: stock-pulse-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 스케줄 트리거는 "예약 시점"의 SHA 를 준다. 최대 3시간 밀려 깨어나므로
      # 명시적으로 최신 main 을 받아 오래된 데이터 위에 덮어쓰지 않게 한다.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rebuild site data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python -m pipeline.run sync

      # 이 잡은 26분쯤 걸려서 그 사이 main 이 움직일 확률이 가장 높다.
      # 충돌 처리 근거는 .github/scripts/commit-data.sh 주석 참고.
      - name: Commit data
        run: |
          bash .github/scripts/commit-data.sh "chore(data): sync $(date -u +'%Y-%m-%d %H:%M UTC')"
