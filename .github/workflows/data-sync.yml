name: data-sync

# Rebuild all site data after each market close and commit the JSON.
# 07:30 UTC ≈ 16:30 KST (국장 마감 후), 21:30 UTC ≈ 06:30 KST (미장 마감 후).
on:
  schedule:
    - cron: "30 7,21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: stock-pulse-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rebuild site data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python -m pipeline.run sync

      - name: Commit data
        run: |
          git config user.name "stock-pulse-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore(data): sync $(date -u +'%Y-%m-%d %H:%M UTC')"
            # 이 잡은 26분쯤 걸려서 그 사이 main 이 움직일 확률이 가장 높다.
            # 단발 push 로 두었다가 2026-07-27 에 실제로 rejected 나면서
            # 25분치 재계산 결과를 통째로 날렸다. 다른 워크플로와 동일하게 재시도한다.
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break || sleep 5
            done
          fi
