name: pulse

# Light intraday refresh: macro indices (지수·환율·VIX·유가·금) + market mood +
# news feed, so the homepage economic snapshot stays current between the
# twice-daily full data-syncs. ~2 min/run. Skips the heavy per-ticker rebuild.
# 주기: 2시간 → 1시간 (2026-08-09, 레포 public 전환으로 Actions 분 제한이 없어짐).
# 30분으로 더 줄이지 않은 이유는 비용이 아니라 큐다 — 이 잡은 data-sync 와
# `stock-pulse-data` 동시성 그룹을 공유하고 `cancel-in-progress: false` 라서,
# 25분짜리 sync 뒤에 pulse 가 쌓이면 서로 밀어낸다. 스케줄러 지연(6~202분)이
# 이미 주기보다 크므로 30분으로 줄여도 실제 신선도는 그만큼 안 좋아진다.
on:
  schedule:
    - cron: "0 * * * *"   # 매시 정각
  workflow_dispatch:

concurrency:
  group: stock-pulse-data   # share the sync group so a pulse never overlaps a full sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      # 스케줄 트리거는 "예약 시점"의 SHA 를 준다. 최대 2시간 밀려 깨어나므로
      # 명시적으로 최신 main 을 받아 오래된 데이터 위에 덮어쓰지 않게 한다.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pulse update
        run: python -m pipeline.run pulse

      - name: Commit data
        run: |
          bash .github/scripts/commit-data.sh "chore(data): pulse $(date -u +'%Y-%m-%d %H:%M UTC')"
