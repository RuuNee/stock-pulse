name: pulse

# Light intraday refresh: macro indices (지수·환율·VIX·유가·금) + market mood +
# news feed, so the homepage economic snapshot stays current between the
# twice-daily full data-syncs. ~2 min/run. Skips the heavy per-ticker rebuild.
on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours
  workflow_dispatch:

concurrency:
  group: stock-pulse-data   # share the sync group so a pulse never overlaps a full sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      # 스케줄 트리거는 "예약 시점"의 SHA 를 준다. 최대 2시간 밀려 깨어나므로
      # 명시적으로 최신 main 을 받아 오래된 데이터 위에 덮어쓰지 않게 한다.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pulse update
        run: python -m pipeline.run pulse

      - name: Commit data
        run: |
          bash .github/scripts/commit-data.sh "chore(data): pulse $(date -u +'%Y-%m-%d %H:%M UTC')"
